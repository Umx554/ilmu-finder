name: Weekly events digest

on:
  schedule:
    - cron: "0 0 * * 5"        # Friday 00:00 UTC = Friday 08:00 Malaysia time (may start a few minutes late)
  workflow_dispatch:            # "Run workflow" button in the Actions tab
    inputs:
      no_send:
        description: "Print only, don't send to Telegram"
        type: boolean
        default: false

permissions:
  contents: write               # lets the job commit state/ (memory between runs)

concurrency:
  group: events-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run agent
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional e-mail delivery (leave these secrets unset to use Telegram only)
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Optional overrides as repository VARIABLES (Settings > Secrets and variables > Actions > Variables).
          # Unset = use config.yaml.
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL }}
          LLM_DELAY: ${{ vars.LLM_DELAY }}
          MAX_PAGES: ${{ vars.MAX_PAGES }}
          MAX_QUERIES: ${{ vars.MAX_QUERIES }}
        run: python -m agent.main ${{ inputs.no_send && '--no-send' || '' }}

      - name: Save memory (state/) back to the repo
        if: always()
        run: |
          git config user.name "events-agent"
          git config user.email "events-agent@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -m "Update agent state [skip ci]"
          for i in 1 2 3; do
            git push && exit 0
            sleep $((i * 5))
            git pull --rebase -X theirs || true   # someone pushed meanwhile: replay our state commit on top
          done
          echo "::warning::Could not save agent state this run (next week will re-read pages)"

      - name: Keep the digest and logs for 30 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_number }}
          path: output/
          retention-days: 30
